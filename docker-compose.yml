services:
  app:
    build:
      context: .
      args:
        # Substituted from --env-file (.env.local). NEXT_PUBLIC_* vars are
        # baked into the client bundle at build time.
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    restart: unless-stopped
    # All runtime config (DATABASE_URL -> Neon, Clerk keys) comes from the
    # git-ignored .env.local — no secrets committed in this file.
    env_file:
      - .env.local
    ports:
      # Host 3002 -> container 3000 (host 3000 was occupied by another process).
      - "3002:3000"
